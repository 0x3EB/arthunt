name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build binaries
        run: |
          mkdir -p dist
          targets="windows/amd64/arthunt.exe windows/arm64/arthunt-arm64.exe linux/amd64/arthunt-linux linux/arm64/arthunt-linux-arm64 darwin/arm64/arthunt-darwin-arm64 darwin/amd64/arthunt-darwin-amd64"
          for t in $targets; do
            os=${t%%/*}; rest=${t#*/}; arch=${rest%%/*}; out=${rest#*/}
            echo "building $os/$arch -> $out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$out" .
          done
          ( cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS )
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
